services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jev-quant-backend
    environment:
      # 未配置 TYPESAFE_API_KEY 时自动降级为本地 Mock 动量模型
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      TQ_USER: ${TQ_USER:-}
      TQ_PASSWORD: ${TQ_PASSWORD:-}
      QUANT_MODE: ${QUANT_MODE:-backtest}
      QUANT_SYMBOLS: ${QUANT_SYMBOLS:-AAPL,rb2610.SHFE}
      QUANT_AUTOSTART: ${QUANT_AUTOSTART:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: jev-quant-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
